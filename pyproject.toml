[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pipecat-siphon"
version = "0.2.0"
description = "Pipecat frame serializer for the siphon-rtp media WebSocket protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SIPhon contributors" }]
requires-python = ">=3.11"
keywords = ["pipecat", "siphon-rtp", "voice-ai", "websocket", "rtp", "telephony"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = [
    "pipecat-ai>=1.8.0,<2",
]

[project.urls]
Homepage = "https://github.com/siphon-project/pipecat-siphon"
Repository = "https://github.com/siphon-project/pipecat-siphon"
Changelog = "https://github.com/siphon-project/pipecat-siphon/blob/main/CHANGELOG.md"
Issues = "https://github.com/siphon-project/pipecat-siphon/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "websockets>=13.1",
    # The agent example's own logic is tested, and importing it pulls the three service classes
    # it wires together. Not a dependency of the package -- nothing under src/ imports these --
    # but without them the example's tests would skip in CI rather than run, which is the way a
    # test suite goes quietly green while the thing it covers rots.
    "pipecat-ai[anthropic,cartesia,deepgram]>=1.8.0,<2",
]
# Deliberately not in `dev`: the control-plane client is a Rust extension with no wheel for every
# interpreter, so requiring it would put a Rust toolchain in the CI path. The tests that cover the
# control plane fake the call handle instead, which is what they should be doing anyway.

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_siphon"]

# What a source distribution is for: the package, its tests, the examples, and the harness that
# proves the whole thing against a real engine. Explicit, because the default sweeps in whatever is
# lying in the tree -- a harness run leaves captures, container logs and the control transcript
# under integration/artifacts, and those were going into the sdist (150 KB, most of it pcaps from
# somebody's last local run).
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "integration",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["integration/artifacts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "integration"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
"examples/*" = ["D100", "D103"]
"integration/proxy/harness_script.py" = ["ANN", "D103"]
"examples/quickstart/route.py" = ["ANN", "D103"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "examples", "integration"]
# `examples/` is a flat set of scripts, not a package, so the tests that exercise the agent
# example import it by bare name. Mirrors the sys.path insert in tests/conftest.py.
mypy_path = "examples"
strict = true
warn_unreachable = true
# pipecat's `@transport.event_handler(...)` is an untyped decorator; every handler in a pipecat
# app goes through it, so this is the one strict flag that cannot be satisfied from here.
disallow_untyped_decorators = false
# The two files in the tree that cannot be type-checked from here. Both are siphon-sip call
# scripts: they run inside that daemon's embedded interpreter against a `siphon` module that only
# exists in the daemon's process, and their handler signatures are fixed by that API. Everything
# else under integration/ and examples/ is checked strictly, like the package itself.
exclude = ["integration/proxy/harness_script\\.py", "examples/quickstart/route\\.py"]

[[tool.mypy.overrides]]
module = ["audioop", "pipecat.*", "websockets.*"]
ignore_missing_imports = true

# The control-plane SDK is a PyO3 extension with no stubs, and it is optional besides: only the
# agent example imports it, and only when the control plane is actually wired up.
[[tool.mypy.overrides]]
module = ["siphon_control", "siphon_control.*"]
ignore_missing_imports = true

# numpy ships stubs that use 3.12-only syntax, which mypy cannot parse while analysing for the
# 3.11 floor. We never touch numpy ourselves; it arrives through pipecat's resampler.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
