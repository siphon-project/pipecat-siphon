# .github/workflows/release.yaml — gate, build and publish to PyPI on tag push.
#
# Adapted from siphon-sip's release.yaml for this repository's reality: one pure-Python package,
# no Rust, no binaries, no container image. Distribution is PyPI and nothing else, so the whole
# workflow is version gate → test gate → publish → GitHub release.
#
# Auth is PyPI Trusted Publishing (OIDC), the same as the sibling repositories: there is no API
# token in repository secrets and none should be added. It has to be enabled once on PyPI, and
# because the project does not exist there yet it is added as a *pending* publisher (PyPI → Your
# projects → Publishing → Add a pending publisher) naming project `pipecat-siphon`, owner
# `siphon-project`, repository `pipecat-siphon`, workflow `release.yaml`, environment left empty.
# Without it the publish step fails closed rather than silently skipping.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── The tag and the package must agree ────────────────────────────────────────────────────
  # hatchling reads the version out of pyproject.toml, so a tag that disagreed with it would
  # publish a version nobody asked for. Fail here, before anything is built.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Project version must equal the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          project_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          echo "tag=$tag_version pyproject=$project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::project version ($project_version) does not match tag ($tag_version) — bump [project].version in the release commit."
            exit 1
          fi

  # ── The gates, on both ends of the supported range ────────────────────────────────────────
  # The floor is what breaks first on a dependency bump, so it is tested rather than declared.
  # The integration harness is deliberately not here: it wants Docker, NET_ADMIN/NET_RAW for the
  # capture and a couple of minutes, and it tests the engine as much as this package — see
  # integration/README.md for the argument.
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q

  # ── Publish to PyPI (Trusted Publishing — OIDC, no token) ─────────────────────────────────
  pypi:
    runs-on: ubuntu-latest
    needs: [verify-version, gates]
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the sdist and the wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI (Trusted Publishing — OIDC, no token)
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── The GitHub release ────────────────────────────────────────────────────────────────────
  # Cut after the publish, so a release on GitHub always corresponds to something installable.
  # Notes come from the tag's own changelog section rather than from a generated commit list.
  github-release:
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Notes from the changelog section for this tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
